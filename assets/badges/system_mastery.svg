<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="25%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="solarRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="legendaryInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#180e03" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#fbbf24" flood-opacity="0.8" />
    </filter>
  </defs>
  <g class="badge-frame">
    <polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="url(#solarGrad)" stroke="url(#solarRim)" stroke-width="2.5" filter="url(#goldGlow)" />
    <polygon points="32,10 68,10 90,32 90,68 68,90 32,90 10,68 10,32" fill="url(#legendaryInnerGlow)" stroke="#fde047" stroke-width="1.2" stroke-opacity="0.9" />
    <circle cx="30" cy="7" r="2.2" fill="#ffffff" />
    <circle cx="70" cy="7" r="2.2" fill="#ffffff" />
    <circle cx="93" cy="30" r="2.2" fill="#ffffff" />
    <circle cx="93" cy="70" r="2.2" fill="#ffffff" />
    <circle cx="70" cy="93" r="2.2" fill="#ffffff" />
    <circle cx="30" cy="93" r="2.2" fill="#ffffff" />
    <circle cx="7" cy="70" r="2.2" fill="#ffffff" />
    <circle cx="7" cy="30" r="2.2" fill="#ffffff" />
  </g>
  <g class="badge-art" filter="url(#goldGlow)">
    <!-- Intersecting gyroscopic astral rings -->
    <ellipse cx="50" cy="50" rx="26" ry="10" transform="rotate(-30 50 50)" fill="none" stroke="#fde047" stroke-width="2" />
    <ellipse cx="50" cy="50" rx="26" ry="10" transform="rotate(30 50 50)" fill="none" stroke="#60a5fa" stroke-width="2" />
    <ellipse cx="50" cy="50" rx="26" ry="10" transform="rotate(90 50 50)" fill="none" stroke="#f472b6" stroke-width="2" />
    <!-- Radiant core -->
    <circle cx="50" cy="50" r="10" fill="#ffffff" stroke="#fbbf24" stroke-width="2" />
    <circle cx="50" cy="50" r="6" fill="#f59e0b" />
    <polygon points="50,42 52,48 58,50 52,52 50,58 48,52 42,50 48,48" fill="#ffffff" />
  </g>
</svg>
