<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="epicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="35%" stop-color="#6b21a8" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <linearGradient id="epicRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <radialGradient id="epicInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#12061e" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>
  <g class="badge-frame">
    <polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="url(#epicGrad)" stroke="url(#epicRim)" stroke-width="2.5" filter="url(#badgeShadow)" />
    <polygon points="32,10 68,10 90,32 90,68 68,90 32,90 10,68 10,32" fill="url(#epicInnerGlow)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="30" cy="7" r="1.8" fill="#f5d0fe" />
    <circle cx="70" cy="7" r="1.8" fill="#f5d0fe" />
    <circle cx="93" cy="30" r="1.8" fill="#f5d0fe" />
    <circle cx="93" cy="70" r="1.8" fill="#f5d0fe" />
    <circle cx="70" cy="93" r="1.8" fill="#f5d0fe" />
    <circle cx="30" cy="93" r="1.8" fill="#f5d0fe" />
    <circle cx="7" cy="70" r="1.8" fill="#f5d0fe" />
    <circle cx="7" cy="30" r="1.8" fill="#f5d0fe" />
  </g>
  <g class="badge-art" filter="url(#badgeShadow)">
    <!-- Pocket watch winder and ring -->
    <circle cx="50" cy="20" r="4.5" fill="none" stroke="#f5d0fe" stroke-width="1.8" />
    <rect x="47.5" y="24" width="5" height="3" fill="#f5d0fe" />
    <!-- Clock dial -->
    <circle cx="50" cy="52" r="24" fill="#2e1065" stroke="#f5d0fe" stroke-width="2.5" />
    <circle cx="50" cy="52" r="20" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Roman numerals / ticks -->
    <line x1="50" y1="35" x2="50" y2="38" stroke="#ffffff" stroke-width="2" />
    <line x1="50" y1="69" x2="50" y2="66" stroke="#ffffff" stroke-width="2" />
    <line x1="33" y1="52" x2="36" y2="52" stroke="#ffffff" stroke-width="2" />
    <line x1="67" y1="52" x2="64" y2="52" stroke="#ffffff" stroke-width="2" />
    <!-- Clock hands pointing across time -->
    <line x1="50" y1="52" x2="50" y2="40" stroke="#fde047" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="52" x2="62" y2="52" stroke="#fde047" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="50" cy="52" r="2.5" fill="#fde047" />
  </g>
</svg>
