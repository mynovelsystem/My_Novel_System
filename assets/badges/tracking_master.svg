<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="epicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="35%" stop-color="#6b21a8" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <linearGradient id="epicRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <radialGradient id="epicInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#12061e" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>
  <g class="badge-frame">
    <polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="url(#epicGrad)" stroke="url(#epicRim)" stroke-width="2.5" filter="url(#badgeShadow)" />
    <polygon points="32,10 68,10 90,32 90,68 68,90 32,90 10,68 10,32" fill="url(#epicInnerGlow)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.8" />
    <circle cx="30" cy="7" r="1.8" fill="#f5d0fe" />
    <circle cx="70" cy="7" r="1.8" fill="#f5d0fe" />
    <circle cx="93" cy="30" r="1.8" fill="#f5d0fe" />
    <circle cx="93" cy="70" r="1.8" fill="#f5d0fe" />
    <circle cx="70" cy="93" r="1.8" fill="#f5d0fe" />
    <circle cx="30" cy="93" r="1.8" fill="#f5d0fe" />
    <circle cx="7" cy="70" r="1.8" fill="#f5d0fe" />
    <circle cx="7" cy="30" r="1.8" fill="#f5d0fe" />
  </g>
  <g class="badge-art" filter="url(#badgeShadow)">
    <!-- Concentric radar target rings -->
    <circle cx="50" cy="50" r="24" stroke="#c084fc" stroke-width="1.8" fill="none" opacity="0.6" />
    <circle cx="50" cy="50" r="16" stroke="#f5d0fe" stroke-width="1.8" fill="rgba(192, 132, 252, 0.15)" />
    <circle cx="50" cy="50" r="8" stroke="#38bdf8" stroke-width="2" fill="#0284c7" />
    <!-- Crosshairs -->
    <line x1="50" y1="20" x2="50" y2="30" stroke="#f5d0fe" stroke-width="2" stroke-linecap="round" />
    <line x1="50" y1="70" x2="50" y2="80" stroke="#f5d0fe" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="50" x2="30" y2="50" stroke="#f5d0fe" stroke-width="2" stroke-linecap="round" />
    <line x1="70" y1="50" x2="80" y2="50" stroke="#f5d0fe" stroke-width="2" stroke-linecap="round" />
    <!-- Center bullseye sparkle -->
    <circle cx="50" cy="50" r="3" fill="#ffffff" />
  </g>
</svg>
