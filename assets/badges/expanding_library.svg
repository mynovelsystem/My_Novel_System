<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="jadeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <radialGradient id="rareInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#041814" />
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>
  <g class="badge-frame">
    <polygon points="30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30" fill="url(#jadeGrad)" stroke="url(#jadeRim)" stroke-width="2.5" filter="url(#badgeShadow)" />
    <polygon points="32,10 68,10 90,32 90,68 68,90 32,90 10,68 10,32" fill="url(#rareInnerGlow)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="30" cy="7" r="1.8" fill="#a7f3d0" />
    <circle cx="70" cy="7" r="1.8" fill="#a7f3d0" />
    <circle cx="93" cy="30" r="1.8" fill="#a7f3d0" />
    <circle cx="93" cy="70" r="1.8" fill="#a7f3d0" />
    <circle cx="70" cy="93" r="1.8" fill="#a7f3d0" />
    <circle cx="30" cy="93" r="1.8" fill="#a7f3d0" />
    <circle cx="7" cy="70" r="1.8" fill="#a7f3d0" />
    <circle cx="7" cy="30" r="1.8" fill="#a7f3d0" />
  </g>
  <g class="badge-art" filter="url(#badgeShadow)">
    <!-- Classical temple / library pediment and columns -->
    <polygon points="50,22 25,35 75,35" fill="#34d399" stroke="#a7f3d0" stroke-width="1.5" />
    <rect x="23" y="35" width="54" height="4" fill="#a7f3d0" />
    <!-- Columns -->
    <rect x="28" y="39" width="6" height="28" rx="1" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <rect x="41" y="39" width="6" height="28" rx="1" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <rect x="53" y="39" width="6" height="28" rx="1" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <rect x="66" y="39" width="6" height="28" rx="1" fill="#ecfdf5" stroke="#059669" stroke-width="1" />
    <!-- Base steps -->
    <rect x="21" y="67" width="58" height="4" rx="1" fill="#a7f3d0" />
    <rect x="18" y="71" width="64" height="5" rx="1" fill="#059669" stroke="#34d399" stroke-width="1" />
  </g>
</svg>
